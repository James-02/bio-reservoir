name: Tests

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
    branches:
      - main

# Least-privilege GITHUB_TOKEN for all jobs. This workflow only reads the repo
# (checkout); Codecov uploads use CODECOV_TOKEN, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

        # TODO: Remove `continue-on-error` (make blocking) after we fix existing issues
      - name: ruff check
        continue-on-error: true
        run: ruff check --output-format=github .

      - name: ruff format (check only)
        continue-on-error: true
        run: ruff format --check .

  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # TODO: Extend once the dependency pins are relaxed / updated to support 3.13-3.14
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the locked environment (uv.lock)
        run: uv sync --frozen --extra dev

      # pytest-github-actions-annotate-failures will annotate failing assertions inline
      - name: Run unit tests with coverage
        # TODO: set NUMBA_DISABLE_JIT=1 locally for fuller coverage of the numba-compiled DDE core (omitted for faster CI).
        run: >
          uv run --frozen pytest tests/unit/ -v --tb=short
          --cov --cov-report=xml --cov-report=html --cov-report=term-missing
          --junitxml=junit.xml -o junit_family=legacy

      - name: Upload coverage HTML report
        if: matrix.python-version == '3.11'  # chose a version from matrix
        uses: actions/upload-artifact@v5
        with:
          name: coverage-html
          path: htmlcov/
          if-no-files-found: warn

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

      # Test Analytics: upload JUnit results (failure/flaky-test reporting).
      # Runs even when tests fail so failures are reported to Codecov.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: junit.xml

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # The dataset is downloaded with the Kaggle API; add KAGGLE_USERNAME and KAGGLE_KEY as
    # repository secrets. Without them the data-dependent tests are skipped.
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up uv and Python 3.9
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.9"

      - name: Install the locked environment (uv.lock)
        run: uv sync --frozen --extra dev

      - name: Download and preprocess the ECG dataset
        if: ${{ env.KAGGLE_KEY != '' }}
        run: uv run --frozen python -m utils.preprocessing

      - name: Run integration tests
        run: uv run --frozen pytest tests/integration/ -v --tb=short --junitxml=junit.xml -o junit_family=legacy

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: junit.xml
