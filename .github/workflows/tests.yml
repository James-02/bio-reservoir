name: Tests

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
    branches:
      - main

# Least-privilege GITHUB_TOKEN for all jobs. This workflow only reads the repo
# (checkout); Codecov uploads use CODECOV_TOKEN, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

        # TODO: Remove `continue-on-error` (make blocking) after we fix existing issues
      - name: ruff check
        continue-on-error: true
        run: ruff check --output-format=github .

      - name: ruff format (check only)
        continue-on-error: true
        run: ruff format --check .

  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # TODO: Extend once the dependency pins are relaxed / updated to support 3.13-3.14
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the locked environment (uv.lock)
        run: uv sync --frozen --extra dev

      # pytest-github-actions-annotate-failures will annotate failing assertions inline
      - name: Run unit tests with coverage
        # TODO: set NUMBA_DISABLE_JIT=1 locally for fuller coverage of the numba-compiled DDE core (omitted for faster CI).
        env:
          COVERAGE_FILE: .coverage.unit-${{ matrix.python-version }}
        run: >
          uv run --frozen pytest tests/unit/ -v --tb=short -rs
          --cov --cov-report=term-missing
          --junitxml=junit.xml -o junit_family=legacy

      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-unit-${{ matrix.python-version }}
          path: .coverage.unit-${{ matrix.python-version }}
          include-hidden-files: true
          if-no-files-found: error

      # Test Analytics: upload JUnit results (failure/flaky-test reporting).
      # Runs even when tests fail so failures are reported to Codecov.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: junit.xml

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # The dataset is downloaded with the Kaggle API; add KAGGLE_USERNAME and KAGGLE_KEY as
    # repository secrets. Without them the data-dependent tests are skipped.
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"

      - name: Install the locked environment (uv.lock)
        run: uv sync --frozen --extra dev

      - name: Download and preprocess the ECG dataset
        if: ${{ env.KAGGLE_KEY != '' }}
        run: uv run --frozen python -m utils.preprocessing

      - name: Run integration tests with coverage
        env:
          COVERAGE_FILE: .coverage.integration
        run: >
          uv run --frozen pytest tests/integration/ -v --tb=short -rs
          --cov --cov-report=term-missing
          --junitxml=junit.xml -o junit_family=legacy

      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-integration
          path: .coverage.integration
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: junit.xml

  # One coverage report from both test jobs, so the Codecov patch check counts lines that
  # only the integration tests exercise.
  coverage:
    name: Coverage (unit and integration tests)
    needs: [unit-tests, integration-tests]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Set up uv and Python 3.11
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.11"

      - name: Install the locked environment (uv.lock)
        run: uv sync --frozen --extra dev

      - name: Download coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: Combine coverage data
        run: |
          uv run --frozen coverage combine
          uv run --frozen coverage xml
          uv run --frozen coverage html
          uv run --frozen coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: htmlcov/

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          disable_search: true
          fail_ci_if_error: false
