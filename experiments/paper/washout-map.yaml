# The washout map (Figure 2D): the design's input gain and exchange rate at each AHL washout
# rate (0.3-1.2 per minute) and cell density (0.6-0.85); reporting seeds 6348-6352.
#    python -m training.run sweep experiments/paper/washout-map.yaml --list
#    python -m training.run study-table experiments/paper/washout-map.yaml --group
base: models/array.yaml
study:
  trials: 25
  metric: f1
  sampler: {type: grid, seed: 6337}
  search:
    reservoir.params.washout_rate: {type: categorical, choices: ['{washout}']}
    reservoir.params.cell_density: {type: categorical, choices: [0.6, 0.7, 0.75, 0.8, 0.85]}
    reservoir.seed: {type: categorical, choices: [6348, 6349, 6350, 6351, 6352]}
sweep:
  name: washout-map-{washout}
  description: 'The array at washout {washout} per minute and cell density 0.6-0.85; reporting seeds 6348-6352.'
  washout: [0.3, 0.4, 0.6, 0.9, 1.2]
