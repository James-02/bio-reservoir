# RUN ONCE, LAST. The test split: run only after every other reported number is fixed, once,
# from the release tag; never rerun or tune on it. Each model is fitted on the balanced pool
# (reservoir seed 6348) and scored once on the test split.
#    python -m training.run sweep experiments/paper/test.yaml --list
#    python -m training.run sweep experiments/paper/test.yaml --final-test --processes N
test: {split: test}
sweep:
  - name: test-{model}
    description: '{model} fitted on the balanced pool, reservoir seed 6348, scored once on the test split.'
    model:
      array: models/array.yaml
      array-forest: models/array-forest.yaml
      array-ideal: {base: models/array.yaml, features: {variables: null, aggregation: mean, measurement_noise: 0.0, reference: null}}
      isolated-traps: models/isolated-traps.yaml
      esn-mean: models/esn-mean.yaml
      esn-image: models/esn-image.yaml
    seed: {reservoir.seed: [6348]}

  - name: test-raw-{readout}
    description: 'Raw-beat baseline: {readout} fitted on the balanced pool, scored once on the test split.'
    readout:
      ridge: &raw
        seed: 6337
        task: {labels: five-class, rows: 4015, balance_classes: true, scaler: sequence_zscore, seed: 6337}
        reservoir: {type: none}
        readout: {classifier: RidgeCV, scale: true, params: {scoring: f1_macro}}
        cv: {folds: 5, seed: 6337}
      rf:
        <<: *raw
        readout:
          classifier: RF
          scale: false
          params: {n_estimators: 326, criterion: log_loss, max_depth: 23, max_features: sqrt, min_samples_split: 2, min_samples_leaf: 1, class_weight: balanced, oob_score: true, random_state: 6337, n_jobs: -1}
      histgb:
        <<: *raw
        readout:
          classifier: HistGB
          scale: true
          params: {max_iter: 500, early_stopping: true, class_weight: balanced, random_state: 6337}
          search: {learning_rate: [0.05, 0.1], max_leaf_nodes: [31, 63]}
          inner_folds: 3
