# Design Studies: the equal-budget searches of the array and of each comparison (two seeded
# Optuna TPE studies of 150 trials each, scored on the search seed 6337), and the selection of
# each: its five best points rescored on the selection seeds 6368-6372.
#    python -m training.run sweep experiments/paper/searches.yaml --list
#    python -m training.run sweep experiments/paper/searches.yaml --only experiment=search-array-a --processes N
#    python -m training.run study-table experiments/paper/searches.yaml --only experiment=selection-array --group
sweep:
  - name: '{experiment}'
    experiment:
      search-array-a:
        description: 'Search of the array with the array''s budget: input gain, exchange rate, washout and cell
          density; study a (sampler seed 6337, started from the best setting of a preliminary search).'
        seed: 6337
        task:
          labels: five-class
          rows: 4015
          balance_classes: true
          scaler: sequence_zscore
          seed: 6337
        reservoir:
          type: bioreservoir
          params:
            units: 576
            warmup: 900
            rk4_substeps: 32
            input_scaling: 0.1056912136240529
            input_connectivity: 1.0
            input_bias: false
            bias_scaling: 0.1
            dde_scaling: 0.0006439480590749527
            cell_coupling: 12.74579065885262
            noise_in: 0.01442
            output_variables: IHe
            param_heterogeneity_cv: 0.1
            param_heterogeneity_seed: null
            heterogeneity_mean_preserving: true
            topology_type: lattice
            geometry: per_node
            delay_scheme: substep
            coupling: diffusion
            diffusion_rate: 0.5334242300673576
            input_encoding: nonnegative
            input_sign: positive
        features:
          variables: [I]
          aggregation: images_at:140,187
          measurement_noise: 0.01
          reference: start
        readout:
          classifier: RidgeCV
          scale: true
          params: {scoring: f1_macro}
        cv: {folds: 5, seed: 6337}
        study:
          trials: 150
          metric: f1
          sampler: {type: tpe, seed: 6337, multivariate: true, n_startup_trials: 24}
          enqueue: [{reservoir.params.input_scaling: 0.1056912136240529, reservoir.params.diffusion_rate: 0.5334242300673576,
              reservoir.params.washout_rate: 0.6, reservoir.params.cell_density: 0.7}]
          search:
            reservoir.params.input_scaling: {type: float, low: 0.0138494, high: 0.553975, log: true}
            reservoir.params.diffusion_rate: {type: float, low: 0.01, high: 10.0, log: true}
            reservoir.params.washout_rate: {type: float, low: 0.3, high: 1.2, log: true}
            reservoir.params.cell_density: {type: float, low: 0.5, high: 0.85}
