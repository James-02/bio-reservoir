name: array
description: 'The design: 576 traps (24 x 24) exchanging AHL with their neighbours, read from two
  images of the LuxI reporter at 140 and 187 min, each over the trap''s image at the start of the
  beat, with 1% measurement noise, by ridge regression.'
seed: 6337
task:
  labels: five-class
  rows: 4015
  balance_classes: true
  scaler: sequence_zscore
  seed: 6337
reservoir:
