  params:
    units: 576
    warmup: 900
    rk4_substeps: 32
    input_scaling: 0.14577381134042164
    input_connectivity: 1.0
    input_bias: false
    bias_scaling: 0.1
    dde_scaling: 0.0006439480590749527
    cell_coupling: 12.74579065885262
    noise_in: 0.01442
    output_variables: IHe
    param_heterogeneity_cv: 0.1
    param_heterogeneity_seed: null
    heterogeneity_mean_preserving: true
    topology_type: lattice
    geometry: per_node
    delay_scheme: substep
    coupling: diffusion
    diffusion_rate: 1.6166883504445881
    washout_rate: 0.31965228057948114
    cell_density: 0.8271330147306859
    input_encoding: nonnegative
    input_sign: positive
features:
  variables: [I]
  aggregation: images_at:140,187
  measurement_noise: 0.01
  reference: start
readout:
