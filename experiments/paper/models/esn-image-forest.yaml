name: esn-image-forest
description: Echo state network read like the array from four images, by the random forest.
seed: 6337
task:
  labels: five-class
  rows: 4015
  balance_classes: true
  scaler: sequence_zscore
  seed: 6337
reservoir:
  type: esn
  params:
    units: 576
    esn_leak_rate: 0.06431119568330097
    esn_spectral_radius: 2.261918774863767
    esn_activation: tanh
    input_scaling: 0.9086673945833228
    input_connectivity: 0.6246343669642176
    input_bias: true
    bias_scaling: 0.5967821243594292
    noise_in: 0.005487227657292568
    noise_rc: 0.0009442056404533605
    rc_connectivity: 0.11675521798984001
features: {aggregation: 'images:4', measurement_noise: 0.01}
readout:
  classifier: RF
  scale: false
  params:
    n_estimators: 326
    criterion: log_loss
    max_depth: 23
    max_features: sqrt
    min_samples_split: 2
    min_samples_leaf: 1
    class_weight: balanced
    oob_score: true
    random_state: 6337
    n_jobs: -1
cv: {folds: 5, seed: 6337}
