# D5 controls validation (experiments/v0.2/checks/controls). Port check of the pilots' control.
name: d5-random-features-pilot
description: 'Port check: the pilots (RP7) drew their 8,000 random features with
  numpy.random.default_rng(6337 + 8000), W ~ N(0, 1/187) and then b ~ U(-1, 1), in the
  order this control draws them, and used the whole beat (the final step) without noise.
  RP7 reported macro-F1 0.877 for scaled ridge (alphas 1e-3 to 1e4).'
seed: 6337
task:
  labels: five-class
  rows: 4015
  balance_classes: true
  max_per_class: null
  cap_includes_test: false
  scaler: sequence_zscore
  data_file: null
reservoir:
  type: random_features
  seed: 14337
  params:
    units: 8000
features:
  aggregation: final
  measurement_noise: 0.0
readout:
  classifier: RidgeCV
  scale: true
cv:
  folds: 5
  simulate: once
