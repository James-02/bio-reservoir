# D5 controls validation (experiments/v0.2/checks/controls). Random-features control.
name: d5-random-features-ridge
description: 'Random features tanh(W z + b) of the beat seen so far (W ~ N(0, 1/187), b ~
  U(-1, 1)), and the random linear map (activation: linear), with 2,000 or 8,000 units; scaled
  ridge with its strength chosen by leave-one-out (RidgeCV). Grid: three reservoir seeds x
  one image (final), four images or the mean over the beat x clean or 1% multiplicative measurement
  noise.'
seed: 6337
task:
  labels: five-class
  rows: 4015
  balance_classes: true
  max_per_class: null
  cap_includes_test: false
  scaler: sequence_zscore
  data_file: null
reservoir:
  type: random_features
  seed: 6337
  params:
    units: 8000
features: {}
readout:
  classifier: RidgeCV
  scale: true
cv:
  folds: 5
  simulate: once
study:
  trials: 72
  metric: f1
  sampler:
    type: grid
  search:
    reservoir.params.units:
      type: categorical
      choices:
      - 2000
      - 8000
    reservoir.params.activation:
      type: categorical
      choices:
      - tanh
      - linear
    reservoir.seed:
      type: categorical
      choices:
      - 6337
      - 6338
      - 6339
    features.aggregation:
      type: categorical
      choices:
      - final
      - images:4
      - mean
    features.measurement_noise:
      type: categorical
      choices:
      - 0.0
      - 0.01
