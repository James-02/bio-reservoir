# D5 controls validation (experiments/v0.2/checks/controls). Linear-surrogate control.
name: d5-surrogate-meanc-6339-forest
description: Linear surrogate of the P centre (seed 6339, the clean reporter mean), fitted
  in each fold; the v0.1 random forest.
seed: 6337
reservoir:
  states_from: d5-p-meanc-6339
  surrogate: linear
features:
  measurement_noise: 0.0
readout:
  classifier: RF
  scale: false
  params:
    n_estimators: 326
    criterion: log_loss
    max_depth: 23
    max_features: sqrt
    min_samples_split: 2
    min_samples_leaf: 1
    class_weight: balanced
    oob_score: true
    random_state: 6337
    n_jobs: -1
