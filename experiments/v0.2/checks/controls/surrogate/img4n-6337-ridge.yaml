# D5 controls validation (experiments/v0.2/checks/controls). Linear-surrogate control.
name: d5-surrogate-img4n-6337-ridge
description: Linear surrogate of the P centre (seed 6337, four reporter images, 1% noise),
  fitted in each fold; scaled ridge with its strength chosen by leave-one-out (RidgeCV). Its
  features are the surrogate's predictions, without added noise.
seed: 6337
reservoir:
  states_from: d5-p-img4n-6337
  surrogate: linear
features:
  measurement_noise: 0.0
readout:
  classifier: RidgeCV
  scale: true
