# D5 controls validation (experiments/v0.2/checks/controls). Source run of the linear surrogate.
name: d5-p-img1n-6339
description: 'P centre, reservoir seed 6339, one reporter image, 1% noise; scaled RidgeCV.
  Saves its states for the linear surrogate: run with --out results/runs/d5-p-img1n-6339.'
seed: 6337
task:
  labels: five-class
  rows: 4015
  balance_classes: true
  max_per_class: null
  cap_includes_test: false
  scaler: sequence_zscore
  data_file: null
reservoir:
  type: bioreservoir
  seed: 6339
  params:
    units: 1024
    warmup: 800
    rk4_substeps: 16
    input_scaling: 0.155113
    input_connectivity: 0.66
    input_bias: false
    bias_scaling: 0.1
    rc_scaling: 0.007036187544739917
    dde_scaling: 0.0006439480590749527
    cell_coupling: 12.74579065885262
    noise_in: 0.01442
    noise_rc: 0.2397
    output_variables: IHe
    param_heterogeneity_cv: 0.065
    param_heterogeneity_seed: 7
    heterogeneity_mean_preserving: true
    topology_type: lattice
    interaction_diameters: 8.2
    fade_alpha: 2.80278092396274e-05
    sparsity: 1.0
    signed: false
    p_excite: 1.0
    geometry: per_node
    delay_scheme: substep
    normalize_after_masks: true
    coupling: diffusion
    diffusion_rate: 0.6
    input_encoding: nonnegative
    input_range:
    - -3.0
    - 8.0
    input_sign: positive
features:
  variables:
  - I
  aggregation: final
  measurement_noise: 0.01
readout:
  classifier: RidgeCV
  scale: true
cv:
  folds: 5
  simulate: once
outputs:
  save_states: true
