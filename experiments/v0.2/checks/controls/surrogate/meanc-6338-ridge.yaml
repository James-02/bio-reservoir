# D5 controls validation (experiments/v0.2/checks/controls). Linear-surrogate control.
name: d5-surrogate-meanc-6338-ridge
description: Linear surrogate of the P centre (seed 6338, the clean reporter mean), fitted
  in each fold; scaled ridge with its strength chosen by leave-one-out (RidgeCV).
seed: 6337
reservoir:
  states_from: d5-p-meanc-6338
  surrogate: linear
features:
  measurement_noise: 0.0
readout:
  classifier: RidgeCV
  scale: true
