# D5 controls validation (experiments/v0.2/checks/controls). Leaky-integrator control.
name: d5-leaky-bank-ridge
description: '24 leaky integrators of the non-negatively encoded beat (time constants 1 to
  256 samples) with their 23 band-pass differences (47 features), alone or mapped by a fixed
  random matrix to 1,024 (the P array) or 8,000 features; scaled ridge with its strength chosen
  by leave-one-out (RidgeCV). Grid: three reservoir seeds x one image (final), four images
  or the mean over the beat x clean or 1% multiplicative measurement noise.'
seed: 6337
task:
  labels: five-class
  rows: 4015
  balance_classes: true
  max_per_class: null
  cap_includes_test: false
  scaler: sequence_zscore
  data_file: null
reservoir:
  type: leaky_bank
  seed: 6337
  params:
    units: 24
features: {}
readout:
  classifier: RidgeCV
  scale: true
cv:
  folds: 5
  simulate: once
study:
  trials: 54
  metric: f1
  sampler:
    type: grid
  search:
    reservoir.params.expansion:
      type: categorical
      choices:
      - null
      - 1024
      - 8000
    reservoir.seed:
      type: categorical
      choices:
      - 6337
      - 6338
      - 6339
    features.aggregation:
      type: categorical
      choices:
      - final
      - images:4
      - mean
    features.measurement_noise:
      type: categorical
      choices:
      - 0.0
      - 0.01
