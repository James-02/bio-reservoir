# Realism options (D3, v0.2): all three groups at 0.1 and 0.3 (a 2 x 2 x 2 factorial
# design), at U #68, three reservoir seeds. Readout: the v0.1 random forest on the clean
# mean of LuxI and external AHL over the beat.
# The heterogeneity seed follows the reservoir seed (param_heterogeneity_seed: null), so each
# seed is an independent array: input wiring, colonies and noise.
#   python -m training.run study experiments/v0.2/checks/realism-options/d3-u-groups-rf.yaml --processes N
name: d3-u-groups-rf
description: 'All three groups at 0.1 and 0.3 (a 2 x 2 x 2 factorial design) at U #68 (N = 1,000
  uncoupled colonies, input connectivity 0.90, kinetic heterogeneity 0.189, warm-up 91, 32 substeps;
  mean-preserving factors); the v0.1 random forest on the clean mean of LuxI and external AHL
  over the beat; reservoir seeds 6337-6339.'
seed: 6337
task:
  labels: five-class
  rows: 4015
  balance_classes: true
  max_per_class: null
  cap_includes_test: false
  scaler: sequence_zscore
  seed: 6337
reservoir:
  type: bioreservoir
  seed: 6337
  params:
    units: 1000
    warmup: 91
    rk4_substeps: 32
    input_scaling: 0.15955052947198983
    input_connectivity: 0.8973131056317318
    input_bias: false
    bias_scaling: 0.1
    rc_scaling: 0.007036187544739917
    dde_scaling: 0.0006439480590749527
    cell_coupling: 12.74579065885262
    noise_in: 0.01442
    noise_rc: 0.2397
    output_variables: IHe
    param_heterogeneity_cv: 0.1888529465296334
    param_heterogeneity_seed: null
    heterogeneity_mean_preserving: true
    heterogeneity_density_cv: 0.0
    heterogeneity_dilution_cv: 0.0
    input_levels: 1
    reset_noise: 0.0
    topology_type: lattice
    interaction_diameters: 8.2
    fade_alpha: 2.80278092396274e-05
    sparsity: 1.0
    signed: false
    p_excite: 1.0
    geometry: per_node
    delay_scheme: substep
    normalize_after_masks: true
    coupling: none
    diffusion_rate: 1.0
    input_encoding: nonnegative
    input_sign: positive
features:
  aggregation: mean
  variables: null
  measurement_noise: 0.0
readout:
  classifier: RF
  scale: false
  params:
    n_estimators: 326
    criterion: log_loss
    oob_score: true
    max_features: sqrt
    max_depth: 23
    min_samples_split: 2
    min_samples_leaf: 1
    class_weight: balanced
    random_state: 6337
    n_jobs: -1
cv:
  folds: 5
  primary_average: macro
  simulate: once
  seed: 6337
outputs:
  save_states: false
study:
  trials: 24
  metric: f1
  sampler:
    type: grid
  search:
    reservoir.params.param_heterogeneity_cv:
      type: categorical
      choices:
      - 0.1
      - 0.3
    reservoir.params.heterogeneity_density_cv:
      type: categorical
      choices:
      - 0.1
      - 0.3
    reservoir.params.heterogeneity_dilution_cv:
      type: categorical
      choices:
      - 0.1
      - 0.3
    reservoir.seed:
      type: categorical
      choices:
      - 6337
      - 6338
      - 6339
