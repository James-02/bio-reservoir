# Realism options (D3, v0.2): kinetic (strain) heterogeneity at 32 substeps, at the P
# centre, three reservoir seeds. Readout: the v0.1 random forest on the clean mean of LuxI
# and external AHL over the beat.
# The heterogeneity seed follows the reservoir seed (param_heterogeneity_seed: null), so each
# seed is an independent array: input wiring, colonies and noise.
#   python -m training.run study experiments/v0.2/checks/realism-options/d3-p-kinetic32-rf.yaml --processes N
name: d3-p-kinetic32-rf
description: Kinetic (strain) heterogeneity at 32 substeps at the P centre (N = 1,024 trap lattice,
  diffusive coupling 0.6, input x5.6 with connectivity 0.66, kinetic heterogeneity 0.065, warm-up
  800, 32 substeps); at 16 substeps colonies whose LuxI or AiiA degradation rate exceeds the
  RK4 limit go negative at kinetic CVs of 0.3 and above; the v0.1 random forest on the clean
  mean of LuxI and external AHL over the beat; reservoir seeds 6337-6339.
seed: 6337
task:
  labels: five-class
  rows: 4015
  balance_classes: true
  max_per_class: null
  cap_includes_test: false
  scaler: sequence_zscore
  seed: 6337
reservoir:
  type: bioreservoir
  seed: 6337
  params:
    units: 1024
    warmup: 800
    rk4_substeps: 32
    input_scaling: 0.155113
    input_connectivity: 0.66
    input_bias: false
    bias_scaling: 0.1
    rc_scaling: 0.007036187544739917
    dde_scaling: 0.0006439480590749527
    cell_coupling: 12.74579065885262
    noise_in: 0.01442
    noise_rc: 0.2397
    output_variables: IHe
    param_heterogeneity_cv: 0.065
    param_heterogeneity_seed: null
    heterogeneity_mean_preserving: true
    heterogeneity_density_cv: 0.0
    heterogeneity_dilution_cv: 0.0
    input_levels: 1
    reset_noise: 0.0
    topology_type: lattice
    interaction_diameters: 8.2
    fade_alpha: 2.80278092396274e-05
    sparsity: 1.0
    signed: false
    p_excite: 1.0
    geometry: per_node
    delay_scheme: substep
    normalize_after_masks: true
    coupling: diffusion
    diffusion_rate: 0.6
    input_encoding: nonnegative
    input_sign: positive
features:
  aggregation: mean
  variables: null
  measurement_noise: 0.0
readout:
  classifier: RF
  scale: false
  params:
    n_estimators: 326
    criterion: log_loss
    oob_score: true
    max_features: sqrt
    max_depth: 23
    min_samples_split: 2
    min_samples_leaf: 1
    class_weight: balanced
    random_state: 6337
    n_jobs: -1
cv:
  folds: 5
  primary_average: macro
  simulate: once
  seed: 6337
outputs:
  save_states: false
study:
  trials: 9
  metric: f1
  sampler:
    type: grid
  search:
    reservoir.params.param_heterogeneity_cv:
      type: categorical
      choices:
      - 0.2
      - 0.3
      - 0.5
    reservoir.seed:
      type: categorical
      choices:
      - 6337
      - 6338
      - 6339
