# Realism options (D3, v0.2): memory of the starting state. The P centre with
# reset_noise 0.03; eight noise-free LuxI images per beat, states saved. Comparing
# the saved images of d3-reset-memory-0 and d3-reset-memory-0.03 beat by beat shows
# how much of a perturbed start remains at each point of the beat.
#   python -m training.run run experiments/v0.2/checks/realism-options/d3-reset-memory-0.03.yaml --processes N
name: d3-reset-memory-0.03
description: The P centre with reset_noise 0.03, reservoir seed 6337; eight LuxI images over
  each beat without measurement noise, states saved. With the other reset-memory run, shows
  whether a perturbed start is forgotten during a beat.
seed: 6337
task:
  labels: five-class
  rows: 4015
  balance_classes: true
  max_per_class: null
  cap_includes_test: false
  scaler: sequence_zscore
  seed: 6337
reservoir:
  type: bioreservoir
  seed: 6337
  params:
    units: 1024
    warmup: 800
    rk4_substeps: 16
    input_scaling: 0.155113
    input_connectivity: 0.66
    input_bias: false
    bias_scaling: 0.1
    rc_scaling: 0.007036187544739917
    dde_scaling: 0.0006439480590749527
    cell_coupling: 12.74579065885262
    noise_in: 0.01442
    noise_rc: 0.2397
    output_variables: IHe
    param_heterogeneity_cv: 0.065
    param_heterogeneity_seed: null
    heterogeneity_mean_preserving: true
    heterogeneity_density_cv: 0.0
    heterogeneity_dilution_cv: 0.0
    input_levels: 1
    reset_noise: 0.03
    topology_type: lattice
    interaction_diameters: 8.2
    fade_alpha: 2.80278092396274e-05
    sparsity: 1.0
    signed: false
    p_excite: 1.0
    geometry: per_node
    delay_scheme: substep
    normalize_after_masks: true
    coupling: diffusion
    diffusion_rate: 0.6
    input_encoding: nonnegative
    input_sign: positive
features:
  aggregation: images:8
  variables:
  - I
  measurement_noise: 0.0
readout:
  classifier: RidgeCV
  scale: true
cv:
  folds: 5
  primary_average: macro
  simulate: once
  seed: 6337
outputs:
  save_states: true
