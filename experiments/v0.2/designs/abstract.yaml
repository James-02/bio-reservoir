# Design: A′, the corrected abstract coupling. Studies name it with base: ../designs/abstract.yaml and list only
# what differs; a run of this file is one reservoir seed (6337).
name: design-abstract
description: >-
  A', the corrected abstract coupling, exploration TPE trial 109 (N = 1,000, 32
  substeps, the v0.1 heterogeneity draw); one image of the LuxI reporter with 1%
  measurement noise, RidgeCV readout.
seed: 6337
task: {labels: five-class, rows: 4015, balance_classes: true, scaler: sequence_zscore, seed: 6337}
reservoir:
  type: bioreservoir
  params:
    units: 1000
    warmup: 1305
    rk4_substeps: 32
    input_scaling: 0.2091196987007607
    input_connectivity: 0.6905345484159945
    input_bias: false
    bias_scaling: 0.1
    rc_scaling: 0.0018614710585649716
    dde_scaling: 0.0006439480590749527
    cell_coupling: 12.74579065885262
    noise_in: 0.01442
    noise_rc: 0.2397
    output_variables: IHe
    param_heterogeneity_cv: 0.007566297560251477
    param_heterogeneity_seed: null
    heterogeneity_mean_preserving: false
    topology_type: distance
    interaction_diameters: 8.2
    fade_alpha: 2.80278092396274e-05
    sparsity: 0.5759952026896107
    signed: true
    p_excite: 0.8354274565239865
    geometry: per_node
    delay_scheme: substep
    normalize_after_masks: true
    coupling: abstract
    input_encoding: signed
    input_sign: mixed
features:
  variables: [I]
  aggregation: final
  measurement_noise: 0.01
readout: {classifier: RidgeCV, scale: true}
cv: {folds: 5, seed: 6337}
