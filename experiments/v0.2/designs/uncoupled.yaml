# Design: U, the colonies of P without coupling. Studies name it with base: ../designs/uncoupled.yaml and list only
# what differs; a run of this file is one reservoir seed (6337).
name: design-uncoupled
description: >-
  U, the colonies of P without coupling, exploration TPE trial 68 (N = 1,000, 32
  substeps, the v0.1 heterogeneity draw); one image of the LuxI reporter with 1%
  measurement noise, RidgeCV readout.
seed: 6337
task: {labels: five-class, rows: 4015, balance_classes: true, scaler: sequence_zscore, seed: 6337}
reservoir:
  type: bioreservoir
  params:
    units: 1000
    warmup: 91
    rk4_substeps: 32
    input_scaling: 0.15955052947198983
    input_connectivity: 0.8973131056317318
    input_bias: false
    bias_scaling: 0.1
    rc_scaling: 0.007036187544739917
    dde_scaling: 0.0006439480590749527
    cell_coupling: 12.74579065885262
    noise_in: 0.01442
    noise_rc: 0.2397
    output_variables: IHe
    param_heterogeneity_cv: 0.1888529465296334
    param_heterogeneity_seed: null
    heterogeneity_mean_preserving: false
    topology_type: lattice
    interaction_diameters: 8.2
    fade_alpha: 2.80278092396274e-05
    sparsity: 1.0
    signed: false
    p_excite: 1.0
    geometry: per_node
    delay_scheme: substep
    normalize_after_masks: true
    coupling: none
    diffusion_rate: 1.0
    input_encoding: nonnegative
    input_sign: positive
features:
  variables: [I]
  aggregation: final
  measurement_noise: 0.01
readout: {classifier: RidgeCV, scale: true}
cv: {folds: 5, seed: 6337}
