# Phase 2 seeded TPE search: P lattice, over every design parameter, with the ranges of
# the v0.2 exploration searches. Their input and recurrent gains were multiples of the v0.1
# scalings (input 0.0277, recurrent 0.00704; ESN input 0.327); here they are absolute
# scalings. Starts from the exploration's P-lattice optimum (trial 208) and the P centre.
#    python -m training.run study experiments/v0.2/phase-2/lattice.yaml --processes N
#    python -m training.run study-table experiments/v0.2/phase-2/lattice.yaml
#    python -m training.run study-best experiments/v0.2/phase-2/lattice.yaml --out best.yaml
base: ../designs/centre.yaml
name: P2-lattice
description: >-
  Phase 2 TPE search, P lattice: input gain x0.5-20, coupling rate 0.01-10, input
  connectivity 0.1-1, heterogeneity CV 0-0.5, warm-up 50-2,000; N = 1,024, 32 substeps;
  one image of the LuxI reporter with 1% measurement noise, RidgeCV readout; reservoir
  seed 6337. Starts from the exploration's P-lattice optimum (trial 208) and the P
  centre.
study:
  trials: 300
  metric: f1
  sampler: {type: tpe, seed: 6337, multivariate: true, n_startup_trials: 24}
  enqueue:
  - {reservoir.params.input_scaling: 0.10324887955471862, reservoir.params.diffusion_rate: 0.8106029508239884,
    reservoir.params.input_connectivity: 0.7057006974054281, reservoir.params.param_heterogeneity_cv: 0.021272213401751467,
    reservoir.params.warmup: 891}
  - {reservoir.params.input_scaling: 0.155113, reservoir.params.diffusion_rate: 0.6, reservoir.params.input_connectivity: 0.66,
    reservoir.params.param_heterogeneity_cv: 0.065, reservoir.params.warmup: 800}
  search:
    reservoir.params.input_scaling: {type: float, low: 0.0138494, high: 0.553975, log: true}
    reservoir.params.diffusion_rate: {type: float, low: 0.01, high: 10.0, log: true}
    reservoir.params.input_connectivity: {type: float, low: 0.1, high: 1.0}
    reservoir.params.param_heterogeneity_cv: {type: float, low: 0.0, high: 0.5}
    reservoir.params.warmup: {type: int, low: 50, high: 2000, log: true}
