# Phase 2 reruns: the five best trials of P2-lattice at three more reservoir seeds, for the
# selection table. Written from the finished search: the best trials' parameter values,
# enqueued and run exactly (random sampler, as many trials as points).
#    python -m training.run study experiments/v0.2/phase-2/lattice-top.yaml --processes N
#    python -m training.run study-table experiments/v0.2/phase-2/lattice-top.yaml --group
