# Phase 2 reruns: the five best trials of P2-esn at three more reservoir seeds, for the
# selection table. Written from the finished search: the best trials' parameter values,
# enqueued and run exactly (random sampler, as many trials as points).
#    python -m training.run study experiments/v0.2/phase-2/esn-top.yaml --processes N
#    python -m training.run study-table experiments/v0.2/phase-2/esn-top.yaml --group
base: ../designs/esn.yaml
name: P2-esn-top
description: >-
  The five best trials of P2-esn (trials 44, 169, 186, 91, 144; seed 6337) at
  reservoir seeds 6338-6340, run exactly.
reservoir: {seed: 6337}
