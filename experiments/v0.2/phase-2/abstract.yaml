# Phase 2 seeded TPE search: A' (corrected abstract coupling), over every design
# parameter, with the ranges of the v0.2 exploration searches. Their input and recurrent
# gains were multiples of the v0.1 scalings (input 0.0277, recurrent 0.00704; ESN input
# 0.327); here they are absolute scalings. Starts from the exploration's A' optimum (trial
# 109).
#    python -m training.run study experiments/v0.2/phase-2/abstract.yaml --processes N
#    python -m training.run study-table experiments/v0.2/phase-2/abstract.yaml
#    python -m training.run study-best experiments/v0.2/phase-2/abstract.yaml --out best.yaml
base: ../designs/abstract.yaml
name: P2-abstract
description: >-
  Phase 2 TPE search, A' (corrected abstract coupling): input gain x0.25-20, recurrent
  gain x0.01-3, input connectivity 0.1-1, heterogeneity CV 0-0.5, warm-up 50-2,000; N =
  1,024, 16 substeps; one image of the LuxI reporter with 1% measurement noise, RidgeCV
  readout; reservoir seed 6337. Starts from the exploration's A' optimum (trial 109).
reservoir:
  params: {units: 1024, rk4_substeps: 16, heterogeneity_mean_preserving: true}
study:
  trials: 300
  metric: f1
  sampler: {type: tpe, seed: 6337, multivariate: true, n_startup_trials: 24}
  enqueue:
  - {reservoir.params.input_scaling: 0.2091196987007607, reservoir.params.rc_scaling: 0.0018614710585649716,
    reservoir.params.input_connectivity: 0.6905345484159945, reservoir.params.param_heterogeneity_cv: 0.007566297560251477,
    reservoir.params.warmup: 1305}
  search:
    reservoir.params.input_scaling: {type: float, low: 0.00692469, high: 0.553975, log: true}
    reservoir.params.rc_scaling: {type: float, low: 7.03619e-05, high: 0.0211086, log: true}
    reservoir.params.input_connectivity: {type: float, low: 0.1, high: 1.0}
    reservoir.params.param_heterogeneity_cv: {type: float, low: 0.0, high: 0.5}
    reservoir.params.warmup: {type: int, low: 50, high: 2000, log: true}
