# Phase 2 reruns: the five best trials of P2-uncoupled at three more reservoir seeds, for the
# selection table. Written from the finished search: the best trials' parameter values,
# enqueued and run exactly (random sampler, as many trials as points).
#    python -m training.run study experiments/v0.2/phase-2/uncoupled-top.yaml --processes N
#    python -m training.run study-table experiments/v0.2/phase-2/uncoupled-top.yaml --group
base: ../designs/uncoupled.yaml
name: P2-uncoupled-top
description: >-
  The five best trials of P2-uncoupled (trials 182, 189, 78, 138, 109; seed 6337) at
  reservoir seeds 6338-6340, run exactly.
reservoir: {seed: 6337, params: {units: 1024, heterogeneity_mean_preserving: true}}
