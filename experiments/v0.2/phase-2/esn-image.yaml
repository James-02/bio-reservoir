# Phase 2 seeded TPE search: the ESN read like the bioreservoirs, from one image of its
# states (the states at the end of the beat) with 1% multiplicative measurement noise, over
# the design parameters and ranges of P2-esn. Starts from the v0.1 ESN parameters.
#    python -m training.run study experiments/v0.2/phase-2/esn-image.yaml --processes N
#    python -m training.run study-table experiments/v0.2/phase-2/esn-image.yaml
#    python -m training.run study-best experiments/v0.2/phase-2/esn-image.yaml --out best.yaml
base: ../designs/esn.yaml
name: P2-esn-image
description: >-
  Phase 2 TPE search, ESN: leak rate 0.05-1, spectral radius 0.1-3, input gain x0.1-10,
  recurrent connectivity 0.05-0.5, bias scaling 0-2; N = 850 (v0.1); one image of the
  states (end of the beat) with 1% measurement noise, RidgeCV readout; reservoir seed 6337.
  Starts from the v0.1 ESN parameters.
features: {aggregation: final, measurement_noise: 0.01}
study:
  trials: 200
  metric: f1
  sampler: {type: tpe, seed: 6337, multivariate: true, n_startup_trials: 24}
  enqueue:
  - {reservoir.params.esn_leak_rate: 0.3160238707949273, reservoir.params.esn_spectral_radius: 1.6955020298458932,
    reservoir.params.input_scaling: 0.32714579463608107, reservoir.params.rc_connectivity: 0.17937632730640085,
    reservoir.params.bias_scaling: 0.9630661362999436}
  search:
    reservoir.params.esn_leak_rate: {type: float, low: 0.05, high: 1.0}
    reservoir.params.esn_spectral_radius: {type: float, low: 0.1, high: 3.0, log: true}
    reservoir.params.input_scaling: {type: float, low: 0.0327146, high: 3.27146, log: true}
    reservoir.params.rc_connectivity: {type: float, low: 0.05, high: 0.5}
    reservoir.params.bias_scaling: {type: float, low: 0.0, high: 2.0}
