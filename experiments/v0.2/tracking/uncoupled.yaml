# Tracking set: U #68, at three reservoir seeds. It is rerun at every tagged code version
# to follow the model's numbers across versions. Run each version in a fresh workspace, or
# with --storage, so that the trials of an earlier version are not resumed.
#    python -m training.run study experiments/v0.2/tracking/uncoupled.yaml --processes N
#    python -m training.run study-table experiments/v0.2/tracking/uncoupled.yaml --group
base: ../designs/uncoupled.yaml
name: tracking-uncoupled
description: >-
  Tracking set: U, the colonies of P without coupling, exploration TPE trial 68 (N =
  1,000, 32 substeps, the v0.1 heterogeneity draw); one image of the LuxI reporter with
  1% measurement noise, RidgeCV readout; three reservoir seeds.
study:
  trials: 3
  metric: f1
  sampler: {type: grid, seed: 6337}
  search:
    reservoir.seed:
      type: categorical
      choices: [6337, 6338, 6339]
