# Tracking set: ESN, at three reservoir seeds. It is rerun at every tagged code version to
# follow the model's numbers across versions. Run each version in a fresh workspace, or
# with --storage, so that the trials of an earlier version are not resumed.
#    python -m training.run study experiments/v0.2/tracking/esn.yaml --processes N
#    python -m training.run study-table experiments/v0.2/tracking/esn.yaml --group
base: ../designs/esn.yaml
name: tracking-esn
description: >-
  Tracking set: the v0.1 ESN (experiments/benchmarks/v0.1/esn.yaml), clean mean of its
  states over the beat, RidgeCV readout; three reservoir seeds.
study:
  trials: 3
  metric: f1
  sampler: {type: grid, seed: 6337}
  search:
    reservoir.seed:
      type: categorical
      choices: [6337, 6338, 6339]
