# Slow sensing: is the dip at 576 traps the readout's? A ridge interpolation peak sits
# where the features match the training traces, so it moves with the
# trace count (400 or 800 per class); a reservoir effect does not.
#    python -m training.run study experiments/v0.2/slow-sensing/centre-units-traces.yaml --processes N
#    python -m training.run study-table experiments/v0.2/slow-sensing/centre-units-traces.yaml --group
base: ../designs/centre.yaml
name: slow-sensing-centre-units-traces
description: >-
  The P centre on 256-1,024 traps x 400 or 800 traces per class x the order and ramp tasks
  (pump delivery) x three reservoir seeds.
task: {type: inducer, pattern: order, condition: device, n_per_class: 400, scale: sd}
reservoir: {seed: 6337, params: {input_range: [0.0, 20.0]}}
study:
  trials: 60
  metric: f1
  sampler: {type: grid, seed: 6337}
  search:
    reservoir.params.units: {type: int, choices: [256, 400, 576, 784, 1024]}
    task.n_per_class: {type: int, choices: [400, 800]}
    task.pattern: {type: categorical, choices: [order, ramp]}
    reservoir.seed: {type: categorical, choices: [6337, 6338, 6339]}
