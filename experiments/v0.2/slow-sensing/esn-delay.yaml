# Slow sensing: the memory of the v0.1 ESN, read like the bioreservoirs, 0-240 min after the
# pattern.
#    python -m training.run study experiments/v0.2/slow-sensing/esn-delay.yaml --processes N
#    python -m training.run study-table experiments/v0.2/slow-sensing/esn-delay.yaml --group
base: ../designs/esn.yaml
name: slow-sensing-esn-delay
description: >-
  The v0.1 ESN imaged 0-240 min after the pattern x the freq, order, ramp and shape tasks
  (pump delivery) x three reservoir seeds; one noisy image, ridge readout.
task: {type: inducer, pattern: order, condition: device, n_per_class: 400, scale: sd, image_delay: 0}
reservoir: {seed: 6337}
features: {aggregation: final, measurement_noise: 0.01}
study:
  trials: 72
  metric: f1
  sampler: {type: grid, seed: 6337}
  search:
    task.image_delay: {type: int, choices: [0, 15, 30, 60, 120, 240]}
    task.pattern: {type: categorical, choices: [freq, order, ramp, shape]}
    reservoir.seed: {type: categorical, choices: [6337, 6338, 6339]}
