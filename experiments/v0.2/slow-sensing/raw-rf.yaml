# Slow sensing: a random forest on the whole input trace (240 values), its settings chosen by
# inner three-fold CV on macro F1. With raw-histgb, raw-svm and raw-knn, the nonlinear
# readers of the full record: the best of the four is the ceiling for one image of the array.
#    python -m training.run study experiments/v0.2/slow-sensing/raw-rf.yaml --processes N
#    python -m training.run study-table experiments/v0.2/slow-sensing/raw-rf.yaml
name: slow-sensing-raw-rf
description: >-
  No reservoir: a random forest (300 trees, minimum leaf 1 or 3 by inner CV) on the whole
  input trace, the eight tasks x ideal or pump delivery.
seed: 6337
task: {type: inducer, pattern: freq, condition: ideal, n_per_class: 400, scale: sd}
reservoir: {type: none}
readout:
  classifier: RF
  scale: true
  params: {n_estimators: 300, max_features: sqrt, class_weight: balanced, random_state: 6337}
  search: {min_samples_leaf: [1, 3]}
cv: {folds: 5, seed: 6337}
study:
  trials: 16
  metric: f1
  sampler: {type: grid, seed: 6337}
  search:
    task.pattern: {type: categorical, choices: [freq, ramp, order, shape, xor, parity3, xor_tr, parity3_tr]}
    task.condition: {type: categorical, choices: [ideal, device]}
