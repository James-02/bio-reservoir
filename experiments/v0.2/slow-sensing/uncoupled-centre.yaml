# Slow sensing: the P centre without coupling, as slow-sensing-centre: does the
# coupling carry the memory the tasks need?
#    python -m training.run study experiments/v0.2/slow-sensing/uncoupled-centre.yaml --processes N
#    python -m training.run study-table experiments/v0.2/slow-sensing/uncoupled-centre.yaml --group
base: ../designs/centre.yaml
name: slow-sensing-uncoupled-centre
description: >-
  The P centre without coupling, otherwise as slow-sensing-centre.
task: {type: inducer, pattern: freq, condition: ideal, n_per_class: 400, scale: sd}
reservoir: {seed: 6337, params: {coupling: none, input_range: [0.0, 20.0]}}
study:
  trials: 144
  metric: f1
  sampler: {type: grid, seed: 6337}
  search:
    task.pattern: {type: categorical, choices: [freq, ramp, order, shape, xor, parity3, xor_tr, parity3_tr]}
    task.condition: {type: categorical, choices: [ideal, device]}
    reservoir.params.input_scaling: {type: float, choices: [0.0775565, 0.155113, 0.310226]}
    reservoir.seed: {type: categorical, choices: [6337, 6338, 6339]}
