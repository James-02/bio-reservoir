# Slow sensing: the ESN tuned for one noisy image of ECG beats (P2-esn-image trial 178: a
# slow leak and a large spectral radius, so it remembers), read the same way:
# is the bioreservoir's lead over the v0.1 ESN only a matter of memory?
#    python -m training.run study experiments/v0.2/slow-sensing/esn-image-best.yaml --processes N
#    python -m training.run study-table experiments/v0.2/slow-sensing/esn-image-best.yaml --group
base: ../designs/esn.yaml
name: slow-sensing-esn-image-best
description: >-
  The ESN of P2-esn-image trial 178 (leak 0.145, spectral radius 1.99, input scaling 0.157,
  recurrent connectivity 0.161, bias scaling 0.508) on the eight tasks x ideal or pump
  delivery x three reservoir seeds.
task: {type: inducer, pattern: freq, condition: ideal, n_per_class: 400, scale: sd}
reservoir:
  seed: 6337
  params:
    input_scaling: 0.15687145648853565
    bias_scaling: 0.5076146625391504
    rc_connectivity: 0.16136425880825953
    esn_leak_rate: 0.1445283693089213
    esn_spectral_radius: 1.987831058749883
features: {aggregation: final, measurement_noise: 0.01}
study:
  trials: 48
  metric: f1
  sampler: {type: grid, seed: 6337}
  search:
    task.pattern: {type: categorical, choices: [freq, ramp, order, shape, xor, parity3, xor_tr, parity3_tr]}
    task.condition: {type: categorical, choices: [ideal, device]}
    reservoir.seed: {type: categorical, choices: [6337, 6338, 6339]}
