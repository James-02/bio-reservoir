# Slow sensing: k nearest neighbours on the whole input trace (240 values), its settings
# chosen by inner three-fold CV on macro F1; one of the four nonlinear readers (see raw-rf).
#    python -m training.run study experiments/v0.2/slow-sensing/raw-knn.yaml --processes N
#    python -m training.run study-table experiments/v0.2/slow-sensing/raw-knn.yaml
name: slow-sensing-raw-knn
description: >-
  No reservoir: kNN (1-25 neighbours, uniform or distance weights by inner CV) on the whole
  input trace, the eight tasks x ideal or pump delivery.
seed: 6337
task: {type: inducer, pattern: freq, condition: ideal, n_per_class: 400, scale: sd}
reservoir: {type: none}
readout:
  classifier: KNN
  scale: true
  search: {n_neighbors: [1, 3, 5, 9, 15, 25], weights: [uniform, distance]}
cv: {folds: 5, seed: 6337}
study:
  trials: 16
  metric: f1
  sampler: {type: grid, seed: 6337}
  search:
    task.pattern: {type: categorical, choices: [freq, ramp, order, shape, xor, parity3, xor_tr, parity3_tr]}
    task.condition: {type: categorical, choices: [ideal, device]}
