# Slow sensing: U at the best design of its own search (P2-uncoupled trial 182), the fair
# uncoupled comparison for slow-sensing-centre.
#    python -m training.run study experiments/v0.2/slow-sensing/uncoupled-best.yaml --processes N
#    python -m training.run study-table experiments/v0.2/slow-sensing/uncoupled-best.yaml --group
base: ../designs/uncoupled.yaml
name: slow-sensing-uncoupled-best
description: >-
  U at P2-uncoupled trial 182 (input scaling 0.249, input connectivity 1, CV 0.158, warm-up
  262, N = 1,024) on the eight tasks x ideal or pump delivery x three reservoir seeds; one
  noisy image, ridge readout.
task: {type: inducer, pattern: freq, condition: ideal, n_per_class: 400, scale: sd}
reservoir:
  seed: 6337
  params:
    units: 1024
    warmup: 262
    input_scaling: 0.2489831065406975
    input_connectivity: 0.9999518816545098
    param_heterogeneity_cv: 0.15793218300512926
    heterogeneity_mean_preserving: true
    input_range: [0.0, 20.0]
study:
  trials: 48
  metric: f1
  sampler: {type: grid, seed: 6337}
  search:
    task.pattern: {type: categorical, choices: [freq, ramp, order, shape, xor, parity3, xor_tr, parity3_tr]}
    task.condition: {type: categorical, choices: [ideal, device]}
    reservoir.seed: {type: categorical, choices: [6337, 6338, 6339]}
