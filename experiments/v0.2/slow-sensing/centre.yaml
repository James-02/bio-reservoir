# Slow sensing: the P centre on the eight tasks, at three input gains (x0.5-2) and three
# reservoir seeds, under ideal and pump delivery.
#    python -m training.run study experiments/v0.2/slow-sensing/centre.yaml --processes N
#    python -m training.run study-table experiments/v0.2/slow-sensing/centre.yaml --group
base: ../designs/centre.yaml
name: slow-sensing-centre
description: >-
  The P centre (inducer read from 0: input_range 0-20) on the eight tasks x ideal or pump
  delivery x input gain x0.5-2 x three reservoir seeds; one noisy image of the LuxI
  reporter at the end of the trace, ridge readout.
task: {type: inducer, pattern: freq, condition: ideal, n_per_class: 400, scale: sd}
reservoir: {seed: 6337, params: {input_range: [0.0, 20.0]}}
study:
  trials: 144
  metric: f1
  sampler: {type: grid, seed: 6337}
  search:
    task.pattern: {type: categorical, choices: [freq, ramp, order, shape, xor, parity3, xor_tr, parity3_tr]}
    task.condition: {type: categorical, choices: [ideal, device]}
    reservoir.params.input_scaling: {type: float, choices: [0.0775565, 0.155113, 0.310226]}
    reservoir.seed: {type: categorical, choices: [6337, 6338, 6339]}
