# Slow sensing: the v0.1 ESN on the eight tasks, read like the bioreservoirs (one image of its
# states at the end of the trace, 1% measurement noise).
#    python -m training.run study experiments/v0.2/slow-sensing/esn.yaml --processes N
#    python -m training.run study-table experiments/v0.2/slow-sensing/esn.yaml --group
base: ../designs/esn.yaml
name: slow-sensing-esn
description: >-
  The v0.1 ESN (N = 850) on the eight tasks x ideal or pump delivery x three reservoir
  seeds; one noisy image of the states, ridge readout.
task: {type: inducer, pattern: freq, condition: ideal, n_per_class: 400, scale: sd}
reservoir: {seed: 6337}
features: {aggregation: final, measurement_noise: 0.01}
study:
  trials: 48
  metric: f1
  sampler: {type: grid, seed: 6337}
  search:
    task.pattern: {type: categorical, choices: [freq, ramp, order, shape, xor, parity3, xor_tr, parity3_tr]}
    task.condition: {type: categorical, choices: [ideal, device]}
    reservoir.seed: {type: categorical, choices: [6337, 6338, 6339]}
