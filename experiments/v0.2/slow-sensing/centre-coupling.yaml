# Slow sensing: how much coupling the memory needs: the P centre with the coupling rate
# from 0 (uncoupled) to 3.
#    python -m training.run study experiments/v0.2/slow-sensing/centre-coupling.yaml --processes N
#    python -m training.run study-table experiments/v0.2/slow-sensing/centre-coupling.yaml --group
base: ../designs/centre.yaml
name: slow-sensing-centre-coupling
description: >-
  The P centre with coupling rate 0-3 x the order, ramp, shape and xor_tr tasks (pump
  delivery) x three reservoir seeds.
task: {type: inducer, pattern: order, condition: device, n_per_class: 400, scale: sd}
reservoir: {seed: 6337, params: {input_range: [0.0, 20.0]}}
study:
  trials: 72
  metric: f1
  sampler: {type: grid, seed: 6337}
  search:
    reservoir.params.diffusion_rate: {type: float, choices: [0.0, 0.1, 0.3, 0.6, 1.2, 3.0]}
    task.pattern: {type: categorical, choices: [order, ramp, shape, xor_tr]}
    reservoir.seed: {type: categorical, choices: [6337, 6338, 6339]}
