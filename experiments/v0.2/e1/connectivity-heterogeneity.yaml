# E1, Phase 1 grid: input connectivity 0.4-1 x heterogeneity CV 0-0.3 (two-way), around the
# P centre, at three reservoir seeds.
#    python -m training.run study experiments/v0.2/e1/connectivity-heterogeneity.yaml --processes N
#    python -m training.run study-table experiments/v0.2/e1/connectivity-heterogeneity.yaml --group
name: e1-connectivity-heterogeneity
description: >-
  Phase 1 grid: input connectivity 0.4-1 x heterogeneity CV 0-0.3 (two-way) around the
  P centre (input x5.6, coupling rate 0.6, input connectivity 0.66, heterogeneity CV
  0.065 mean-preserving, warm-up 800, N = 1,024 traps, 16 substeps); one image of the
  LuxI reporter with 1% measurement noise, RidgeCV readout; three reservoir seeds.
seed: 6337
task: {labels: five-class, rows: 4015, balance_classes: true, scaler: sequence_zscore, seed: 6337}
reservoir:
  type: bioreservoir
  seed: 6337
  params:
    units: 1024
    warmup: 800
    rk4_substeps: 16
    input_scaling: 0.155113
    input_connectivity: 0.66
    input_bias: false
    bias_scaling: 0.1
    rc_scaling: 0.007036187544739917
    dde_scaling: 0.0006439480590749527
    cell_coupling: 12.74579065885262
    noise_in: 0.01442
    noise_rc: 0.2397
    output_variables: IHe
    param_heterogeneity_cv: 0.065
    param_heterogeneity_seed: null
    heterogeneity_mean_preserving: true
    topology_type: lattice
    interaction_diameters: 8.2
    fade_alpha: 2.80278092396274e-05
    sparsity: 1.0
    signed: false
    p_excite: 1.0
    geometry: per_node
    delay_scheme: substep
    normalize_after_masks: true
    coupling: diffusion
    diffusion_rate: 0.6
    input_encoding: nonnegative
    input_sign: positive
features: {variables: [I], aggregation: final, measurement_noise: 0.01}
readout: {classifier: RidgeCV, scale: true}
cv: {folds: 5, seed: 6337}
study:
  trials: 60
  metric: f1
  sampler: {type: grid, seed: 6337}
  search:
    reservoir.params.input_connectivity:
      type: categorical
      choices: [0.4, 0.6, 0.8, 1.0]
    reservoir.params.param_heterogeneity_cv:
      type: categorical
      choices: [0.0, 0.05, 0.1, 0.2, 0.3]
    reservoir.seed:
      type: categorical
      choices: [6337, 6338, 6339]
