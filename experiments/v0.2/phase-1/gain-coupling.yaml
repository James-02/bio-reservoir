# Phase 1 grid: input gain x2-12 x coupling rate 0.1-4 (two-way), around the P centre,
# at three reservoir seeds.
#    python -m training.run study experiments/v0.2/phase-1/gain-coupling.yaml --processes N
#    python -m training.run study-table experiments/v0.2/phase-1/gain-coupling.yaml --group
base: ../designs/centre.yaml
name: P1-gain-coupling
description: >-
  Phase 1 grid: input gain x2-12 x coupling rate 0.1-4 (two-way) around the P centre
  (input x5.6, coupling rate 0.6, input connectivity 0.66, heterogeneity CV 0.065
  mean-preserving, warm-up 800, N = 1,024 traps, 16 substeps); one image of the LuxI
  reporter with 1% measurement noise, RidgeCV readout; three reservoir seeds.
study:
  trials: 108
  metric: f1
  sampler: {type: grid, seed: 6337}
  search:
    reservoir.params.input_scaling:
      type: categorical
      choices: [0.055397, 0.083096, 0.110795, 0.166192, 0.22159, 0.332385]
    reservoir.params.diffusion_rate:
      type: categorical
      choices: [0.1, 0.3, 0.6, 1.0, 2.0, 4.0]
    reservoir.seed:
      type: categorical
      choices: [6337, 6338, 6339]
