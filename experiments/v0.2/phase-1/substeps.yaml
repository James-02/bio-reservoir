# Phase 1 grid: RK4 substeps 8-128, around the P centre, at three reservoir seeds.
#    python -m training.run study experiments/v0.2/phase-1/substeps.yaml --processes N
#    python -m training.run study-table experiments/v0.2/phase-1/substeps.yaml --group
base: ../designs/centre.yaml
name: P1-substeps
description: >-
  Phase 1 grid: RK4 substeps 8-128 around the P centre (input x5.6, coupling rate 0.6,
  input connectivity 0.66, heterogeneity CV 0.065 mean-preserving, warm-up 800, N =
  1,024 traps, 32 substeps); one image of the LuxI reporter with 1% measurement noise,
  RidgeCV readout; three reservoir seeds.
study:
  trials: 15
  metric: f1
  sampler: {type: grid, seed: 6337}
  search:
    reservoir.params.rk4_substeps:
      type: categorical
      choices: [8, 16, 32, 64, 128]
    reservoir.seed:
      type: categorical
      choices: [6337, 6338, 6339]
