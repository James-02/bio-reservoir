# Phase 1 grid: images 1-4 x measurement noise 0.5-3%, around the P centre, at three
# reservoir seeds.
#    python -m training.run study experiments/v0.2/phase-1/images-noise.yaml --processes N
#    python -m training.run study-table experiments/v0.2/phase-1/images-noise.yaml --group
base: ../designs/centre.yaml
name: P1-images-noise
description: >-
  Phase 1 grid: images 1-4 x measurement noise 0.5-3% around the P centre (input x5.6,
  coupling rate 0.6, input connectivity 0.66, heterogeneity CV 0.065 mean-preserving,
  warm-up 800, N = 1,024 traps, 32 substeps); one image of the LuxI reporter with 1%
  measurement noise, RidgeCV readout; three reservoir seeds.
study:
  trials: 48
  metric: f1
  sampler: {type: grid, seed: 6337}
  search:
    features.aggregation:
      type: categorical
      choices: [final, 'images:2', 'images:3', 'images:4']
    features.measurement_noise:
      type: categorical
      choices: [0.005, 0.01, 0.02, 0.03]
    reservoir.seed:
      type: categorical
      choices: [6337, 6338, 6339]
