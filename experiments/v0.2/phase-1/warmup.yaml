# Phase 1 grid: warm-up 0-2,000 steps (one step is one model minute), around the P
# centre, at three reservoir seeds.
#    python -m training.run study experiments/v0.2/phase-1/warmup.yaml --processes N
#    python -m training.run study-table experiments/v0.2/phase-1/warmup.yaml --group
base: ../designs/centre.yaml
name: P1-warmup
description: >-
  Phase 1 grid: warm-up 0-2,000 steps (one step is one model minute) around the P centre
  (input x5.6, coupling rate 0.6, input connectivity 0.66, heterogeneity CV 0.065
  mean-preserving, warm-up 800, N = 1,024 traps, 16 substeps); one image of the LuxI
  reporter with 1% measurement noise, RidgeCV readout; three reservoir seeds.
study:
  trials: 33
  metric: f1
  sampler: {type: grid, seed: 6337}
  search:
    reservoir.params.warmup:
      type: categorical
      choices: [0, 25, 50, 100, 200, 300, 450, 650, 900, 1300, 2000]
    reservoir.seed:
      type: categorical
      choices: [6337, 6338, 6339]
