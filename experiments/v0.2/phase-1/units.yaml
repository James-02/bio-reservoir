# Phase 1 grid: array size N, square lattices of 100-2,025 traps, around the P centre,
# at three reservoir seeds.
#    python -m training.run study experiments/v0.2/phase-1/units.yaml --processes N
#    python -m training.run study-table experiments/v0.2/phase-1/units.yaml --group
base: ../designs/centre.yaml
name: P1-units
description: >-
  Phase 1 grid: array size N, square lattices of 100-2,025 traps around the P centre
  (input x5.6, coupling rate 0.6, input connectivity 0.66, heterogeneity CV 0.065
  mean-preserving, warm-up 800, N = 1,024 traps, 32 substeps); one image of the LuxI
  reporter with 1% measurement noise, RidgeCV readout; three reservoir seeds.
study:
  trials: 27
  metric: f1
  sampler: {type: grid, seed: 6337}
  search:
    reservoir.params.units:
      type: categorical
      choices: [100, 196, 256, 400, 576, 784, 1024, 1600, 2025]
    reservoir.seed:
      type: categorical
      choices: [6337, 6338, 6339]
