# Phase 1 grid: images 1-4 x calibration error 0-5%, around the P centre, at three run
# seeds. The run seed draws the calibration error and the measurement noise
# (training/observation.py), and the reservoir seed follows it.
#    python -m training.run study experiments/v0.2/phase-1/images-calibration.yaml --processes N
#    python -m training.run study-table experiments/v0.2/phase-1/images-calibration.yaml --group
base: ../designs/centre.yaml
name: P1-images-calibration
description: >-
  Phase 1 grid: images 1-4 x calibration error 0-5% around the P centre (input x5.6,
  coupling rate 0.6, input connectivity 0.66, heterogeneity CV 0.065 mean-preserving,
  warm-up 800, N = 1,024 traps, 32 substeps); one image of the LuxI reporter with 1%
  measurement noise, RidgeCV readout; calibration, measurement noise and reservoir drawn
  with the run seed, which the study searches with the reservoir seed.
study:
  trials: 72
  metric: f1
  sampler: {type: grid, seed: 6337}
  search:
    seed:
      type: categorical
      choices: [6337, 6338, 6339]
    features.aggregation:
      type: categorical
      choices: [final, 'images:2', 'images:3', 'images:4']
    features.calibration_error:
      type: categorical
      choices: [0.0, 0.005, 0.01, 0.02, 0.03, 0.05]
