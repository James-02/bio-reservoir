# Phase 1 grid: kinetic heterogeneity CV 0.3-0.5 around the P centre at 64 RK4 substeps,
# at three reservoir seeds. At 32 substeps fast LuxI degradation blows up some colonies from
# a CV of about 0.4 (UnstableIntegrationError), so P1-heterogeneity misses its top points;
# 64 substeps integrate them (P1-substeps shows 16-128 agree at CV 0.065).
#    python -m training.run study experiments/v0.2/phase-1/heterogeneity-64.yaml --processes N
#    python -m training.run study-table experiments/v0.2/phase-1/heterogeneity-64.yaml --group
base: ../designs/centre.yaml
name: P1-heterogeneity-64
description: >-
  Phase 1 grid: kinetic heterogeneity CV 0.3-0.5 (mean-preserving) around the P centre
  (input x5.6, coupling rate 0.6, input connectivity 0.66, warm-up 800, N = 1,024 traps) at
  64 substeps; one image of the LuxI reporter with 1% measurement noise, RidgeCV readout;
  three reservoir seeds.
reservoir: {seed: 6337, params: {rk4_substeps: 64}}
study:
  trials: 9
  metric: f1
  sampler: {type: grid, seed: 6337}
  search:
    reservoir.params.param_heterogeneity_cv: {type: categorical, choices: [0.3, 0.4, 0.5]}
    reservoir.seed: {type: categorical, choices: [6337, 6338, 6339]}
