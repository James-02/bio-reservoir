# Phase 1 grid: input gain x1-20 of the v0.1 input scaling (0.0277), around the P
# centre, at three reservoir seeds.
#    python -m training.run study experiments/v0.2/phase-1/gain.yaml --processes N
#    python -m training.run study-table experiments/v0.2/phase-1/gain.yaml --group
base: ../designs/centre.yaml
name: P1-gain
description: >-
  Phase 1 grid: input gain x1-20 of the v0.1 input scaling (0.0277) around the P centre
  (input x5.6, coupling rate 0.6, input connectivity 0.66, heterogeneity CV 0.065
  mean-preserving, warm-up 800, N = 1,024 traps, 16 substeps); one image of the LuxI
  reporter with 1% measurement noise, RidgeCV readout; three reservoir seeds.
study:
  trials: 33
  metric: f1
  sampler: {type: grid, seed: 6337}
  search:
    reservoir.params.input_scaling:
      type: categorical
      choices: [0.027699, 0.041548, 0.055397, 0.083096, 0.110795, 0.138494, 0.166192, 0.22159,
        0.276987, 0.387782, 0.553975]
    reservoir.seed:
      type: categorical
      choices: [6337, 6338, 6339]
