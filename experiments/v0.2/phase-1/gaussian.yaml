# Phase 1, layout, for comparison only (no joint search): colonies at random positions
# exchanging AHL through a Gaussian kernel of distance, at the lattice optimum. Range 2-8.2
# cell diameters x coupling rate 0.3-1, at three reservoir seeds.
#    python -m training.run study experiments/v0.2/phase-1/gaussian.yaml --processes N
#    python -m training.run study-table experiments/v0.2/phase-1/gaussian.yaml --group
base: ../designs/centre.yaml
name: P1-gaussian
description: >-
  Gaussian kernel (random positions, topology_type distance) at the lattice optimum:
  range 2-8.2 cell diameters x coupling rate 0.3-1 at the P centre (input x5.6, coupling
  rate 0.6, input connectivity 0.66, heterogeneity CV 0.065 mean-preserving, warm-up
  800, N = 1,024 traps, 16 substeps); one image of the LuxI reporter with 1% measurement
  noise, RidgeCV readout; three reservoir seeds.
reservoir:
  params: {topology_type: distance}
study:
  trials: 45
  metric: f1
  sampler: {type: grid, seed: 6337}
  search:
    reservoir.params.interaction_diameters:
      type: categorical
      choices: [2.0, 2.6, 3.8, 5.2, 8.2]
    reservoir.params.diffusion_rate:
      type: categorical
      choices: [0.3, 0.6, 1.0]
    reservoir.seed:
      type: categorical
      choices: [6337, 6338, 6339]
