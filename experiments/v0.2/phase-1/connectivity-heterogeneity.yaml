# Phase 1 grid: input connectivity 0.4-1 x heterogeneity CV 0-0.3 (two-way), around the
# P centre, at three reservoir seeds.
#    python -m training.run study experiments/v0.2/phase-1/connectivity-heterogeneity.yaml --processes N
#    python -m training.run study-table experiments/v0.2/phase-1/connectivity-heterogeneity.yaml --group
base: ../designs/centre.yaml
name: P1-connectivity-heterogeneity
description: >-
  Phase 1 grid: input connectivity 0.4-1 x heterogeneity CV 0-0.3 (two-way) around the P
  centre (input x5.6, coupling rate 0.6, input connectivity 0.66, heterogeneity CV 0.065
  mean-preserving, warm-up 800, N = 1,024 traps, 32 substeps); one image of the LuxI
  reporter with 1% measurement noise, RidgeCV readout; three reservoir seeds.
study:
  trials: 60
  metric: f1
  sampler: {type: grid, seed: 6337}
  search:
    reservoir.params.input_connectivity:
      type: categorical
      choices: [0.4, 0.6, 0.8, 1.0]
    reservoir.params.param_heterogeneity_cv:
      type: categorical
      choices: [0.0, 0.05, 0.1, 0.2, 0.3]
    reservoir.seed:
      type: categorical
      choices: [6337, 6338, 6339]
