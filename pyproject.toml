[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------
[project]
name = "bioreservoir"
version = "0.2.1"
description = "Genetic oscillator reservoir computer for ECG arrhythmia classification"
readme = "README.md"
requires-python = ">=3.12,<3.13"

# Research-paper environment pins.
#
# This repository is used as a reproducible research codebase rather than as a
# broadly reusable library, so we pin the exact dependency versions used for the
# reported experiments directly in project metadata. This allows
# `pip install -e ".[dev]"` to reproduce the intended environment without a
# separate resolver path.
dependencies = [
    "matplotlib==3.11.2",
    "numpy==1.26.4",
    "pandas==2.2.3",
    "reservoirpy==0.3.16",
    "scikit-learn==1.5.0",
    "scipy==1.13.0",
    "seaborn==0.13.2",
    "optuna==5.0.0",
    "numba==0.60.0",
    "joblib==1.6.0",
    "psutil==7.2.2",
    "kagglehub==1.0.2",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
# pip install -e ".[dev]"
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.15.0",
    "pytest-github-actions-annotate-failures>=0.2",
]

# ---------------------------------------------------------------------------
# Package discovery — only install the library packages, not scripts/tests
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["."]
include = ["bioreservoir*", "training*", "utils*", "optimization*"]
exclude = ["tests*", "scripts*"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-p no:typeguard -v -m 'not benchmark'"
markers = [
    "benchmark: full-size headline reruns compared fold by fold with the v0.1 archive; needs a capable host (run with -m benchmark)",
]
filterwarnings = ["ignore::UserWarning"]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["bioreservoir", "training", "utils", "optimization"]
omit   = ["tests/*", "scripts/*"]

# ---------------------------------------------------------------------------
# Ruff (lint + format)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length    = 100
target-version = "py312"

[tool.ruff.lint]
# Start lenient (errors, pyflakes, import-sort, pyupgrade, bugbear); tighten later.
select = ["E", "F", "I", "UP", "B"]
# Line length is left to the formatter: turn E501 on once the code base has been
# formatted with `ruff format` (a separate, formatting-only change).
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# I is LuxI, as in the model equations.
"bioreservoir/dde.py" = ["E741"]
